<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | LWII Radio</title>
  <meta name="description" content="The page you requested could not be found. Listen live, discover artists, or submit music to Look Who It Is Radio.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#050509">
  <link rel="icon" type="image/png" href="/radiologo.png">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YB353EMH0Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YB353EMH0Z');
  </script>

  <style>
    :root {
      --bg-main: #050509;
      --bg-secondary: #0D0A14;
      --bg-card: rgba(17, 16, 24, 0.92);
      --purple: #9B2CFF;
      --purple-bright: #C45CFF;
      --purple-glow: #E07BFF;
      --text: #FFFFFF;
      --text-soft: #EDE7F8;
      --muted: #A9A0B8;
      --border: rgba(237, 231, 248, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 12%, rgba(155, 44, 255, 0.28), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(196, 92, 255, 0.12), transparent 30%),
        linear-gradient(180deg, var(--bg-main), var(--bg-secondary));
    }

    a:focus-visible {
      outline: 3px solid var(--purple-glow);
      outline-offset: 4px;
    }

    .error-card {
      width: min(100%, 760px);
      padding: clamp(28px, 6vw, 54px);
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.52),
        0 0 55px rgba(155, 44, 255, 0.13);
    }

    .logo-link {
      display: inline-block;
      margin-bottom: 18px;
      border-radius: 50%;
    }

    .logo {
      display: block;
      width: 132px;
      height: 132px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(155, 44, 255, 0.28);
    }

    .error-code {
      margin: 0 0 8px;
      color: var(--purple-bright);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.35rem, 8vw, 4.5rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .message {
      max-width: 590px;
      margin: 0 auto 30px;
      color: var(--text-soft);
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.65;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 570px;
      margin: 0 auto;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 18px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: 0.18s ease;
    }

    .button:hover {
      border-color: rgba(196, 92, 255, 0.7);
      background: rgba(196, 92, 255, 0.09);
      transform: translateY(-2px);
    }

    .button-primary {
      color: #FFFFFF;
      background: linear-gradient(135deg, var(--purple), var(--purple-bright));
      border-color: transparent;
      box-shadow: 0 12px 28px rgba(155, 44, 255, 0.25);
    }

    .button-primary:hover {
      background: linear-gradient(135deg, #A640FF, #CE70FF);
      border-color: transparent;
    }

    .footer-note {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .error-card {
        padding: 28px 18px;
        border-radius: 20px;
      }

      .logo {
        width: 108px;
        height: 108px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }

      .button:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="error-card">
    <a class="logo-link" href="/" aria-label="Return to the LWII Radio homepage">
      <img class="logo" src="/radiologo.png" alt="Look Who It Is Radio logo" width="132" height="132">
    </a>

    <p class="error-code">Error 404</p>
    <h1>This page missed the rotation.</h1>
    <p class="message">
      The link may be outdated, or the page may have moved. The station is still live—choose where you would like to go next.
    </p>

    <nav class="actions" aria-label="Helpful links">
      <a class="button button-primary" href="/#player">Listen Live</a>
      <a class="button" href="/artists.html">View Artists</a>
      <a class="button" href="/submission.html">Submit Music</a>
      <a class="button" href="/">Return Home</a>
    </nav>

    <p class="footer-note">Look Who It Is Radio · Independent rock and country</p>
  </main>
</body>
</html>
